name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# tag 构建要往 Release 里传产物
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单元测试 + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      # ⚠️ 这里的版本必须和 app/build.gradle.kts 里的
      #    compileSdk / buildToolsVersion 对齐，否则构建会在"找不到 android.jar"上失败。
      #    升级 AGP / compileSdk 时一起改这里。
      - name: 安装 SDK 平台与构建工具
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 签名密钥只存在于 GitHub Secrets 里：base64 解回文件、现场生成 keystore.properties。
      # 没有配置密钥时**不失败**，而是回落到 debug 签名 —— 保证 fork 之后能先跑通流水线。
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=未配置签名密钥::KEYSTORE_BASE64 为空，本次构建用 debug 签名，产物不能用于正式发布。"
            exit 0
          fi
          mkdir -p keystore
          # 用 echo 而不是 printf：粘贴进来的 base64 可能带换行，base64 -d 会跳过它们
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "签名配置已就绪（$KEY_ALIAS）"

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 单元测试
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: 构建 Release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 归档测试报告（失败时也上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: myDeepSeek-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 打 tag（v1.2.3）时自动发一个 Release，把 APK 挂上去
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
